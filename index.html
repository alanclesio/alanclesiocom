<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>alanclesio ~ zsh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Catppuccin Mocha-inspired palette */
    --bg: #11111b;
    --bg-term: #1e1e2e;
    --bg-titlebar: #181825;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --green: #a6e3a1;
    --teal: #94e2d5;
    --blue: #89b4fa;
    --mauve: #cba6f7;
    --pink: #f5c2e7;
    --peach: #fab387;
    --yellow: #f9e2af;
    --red: #f38ba8;
    --overlay: #6c7086;
    --selection: #45475a;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(137, 180, 250, 0.10), transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(203, 166, 247, 0.10), transparent 45%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    padding: clamp(12px, 4vw, 48px);
    -webkit-font-smoothing: antialiased;
  }

  /* Fixed interactive backdrop layers that stay put while content scrolls */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  /* Mouse-following glow */
  .backdrop .glow {
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 40%),
        rgba(148, 226, 213, calc(0.16 + var(--scrollGlow, 0) * 0.10)),
        transparent 60%
      );
    transition: background 0.18s ease-out;
  }
  /* Subtle moving aurora that reacts to scroll via --shift */
  .backdrop .aurora {
    position: absolute;
    inset: -30%;
    background:
      radial-gradient(40% 50% at 25% 30%, rgba(137, 180, 250, 0.12), transparent 60%),
      radial-gradient(45% 55% at 78% 72%, rgba(203, 166, 247, 0.12), transparent 62%);
    transform: translate3d(calc(var(--shift, 0) * -18px), calc(var(--shift, 0) * 12px), 0);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    filter: blur(8px);
  }
  /* Faint grid that fades in on scroll */
  .backdrop .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(205, 214, 244, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(205, 214, 244, 0.035) 1px, transparent 1px);
    background-size: 38px 38px;
    opacity: calc(0.25 + var(--scrollGlow, 0) * 0.55);
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
    transition: opacity 0.3s ease;
  }

  ::selection { background: var(--selection); color: var(--text); }

  .terminal {
    width: min(880px, 100%);
    margin: auto;
    background: var(--bg-term);
    border-radius: 12px;
    box-shadow:
      0 28px 70px -18px var(--shadow),
      0 0 0 1px rgba(205, 214, 244, 0.06),
      inset 0 1px 0 rgba(205, 214, 244, 0.04);
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px) scale(0.99);
    animation: boot 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes boot {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--bg-titlebar);
    border-bottom: 1px solid rgba(205, 214, 244, 0.06);
  }

  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }

  .title {
    flex: 1;
    text-align: center;
    font-size: 12.5px;
    color: var(--overlay);
    letter-spacing: 0.04em;
    user-select: none;
  }
  .title .accent { color: var(--subtext); }

  .screen {
    padding: clamp(18px, 3vw, 30px) clamp(18px, 3.5vw, 36px) clamp(26px, 4vw, 40px);
    font-size: clamp(13px, 1.7vw, 15px);
    line-height: 1.85;
    min-height: 420px;
  }

  .line { white-space: pre-wrap; word-break: break-word; }

  .prompt { color: var(--green); font-weight: 700; }
  .path { color: var(--blue); font-weight: 700; }
  .git { color: var(--peach); }
  .arrow { color: var(--mauve); font-weight: 700; }
  .cmd { color: var(--text); }
  .comment { color: var(--overlay); font-style: italic; }
  .muted { color: var(--subtext); }
  .key { color: var(--teal); }
  .val { color: var(--yellow); }
  .ok { color: var(--green); }
  .star { color: var(--yellow); }

  h1.banner {
    font-size: clamp(20px, 4.6vw, 34px);
    font-weight: 800;
    color: var(--mauve);
    line-height: 1.05;
    margin: 6px 0 2px;
    letter-spacing: 0.02em;
    text-shadow: 0 0 22px rgba(203, 166, 247, 0.28);
  }
  .role {
    color: var(--pink);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .block { margin: 4px 0 18px; }

  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 4px 28px;
    margin: 2px 0;
  }
  .skill-row { display: flex; align-items: center; gap: 12px; }
  .skill-name { color: var(--subtext); min-width: 118px; }
  .bar {
    flex: 1;
    height: 9px;
    border-radius: 5px;
    background: var(--selection);
    overflow: hidden;
    position: relative;
  }
  .bar > span {
    position: absolute;
    inset: 0;
    width: 0;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    animation: fill 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes fill { to { width: var(--w); } }

  .cursor {
    display: inline-block;
    width: 9px;
    height: 1.05em;
    background: var(--text);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* sequential reveal */
  .reveal { opacity: 0; animation: rise 0.45s ease forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .input-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0; }
  #userInput {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    flex: 1;
    min-width: 60px;
    caret-color: var(--green);
  }
  .hint { color: var(--overlay); font-size: 12px; margin-top: 14px; }
  .hint b { color: var(--teal); font-weight: 700; }

  a { color: var(--blue); text-decoration: none; border-bottom: 1px dotted rgba(137,180,250,0.5); }
  a:hover { color: var(--teal); border-bottom-color: var(--teal); }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="aurora"></div>
    <div class="grid"></div>
    <div class="glow"></div>
  </div>
  <main class="terminal" role="application" aria-label="Terminal portfolio">
    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="title"><span class="accent">alanclesio</span> — -zsh — 88×26</div>
    </div>
    <div class="screen" id="screen"></div>
  </main>

<script>
(function () {
  const screen = document.getElementById("screen");

  const PROMPT =
    '<span class="prompt">alanclesio@portfolio</span> ' +
    '<span class="path">~</span> ' +
    '<span class="git">(main)</span> <span class="arrow">❯</span> ';

  const skills = [
    ["JavaScript / TS", 92],
    ["Python", 90],
    [".NET Core", 88],
    ["React / Next.js", 88],
    ["Angular", 84],
    ["Node.js", 86],
    ["Azure", 86],
    ["AWS", 82],
    ["Databricks", 80],
    ["Snowflake", 80],
    ["SQL / NoSQL", 83],
  ];

  // Build the scripted output as an array of node-producing steps.
  const steps = [];

  function cmd(text) {
    const el = document.createElement("div");
    el.className = "line reveal";
    el.innerHTML = PROMPT + '<span class="cmd">' + text + "</span>";
    return el;
  }
  function out(html, cls) {
    const el = document.createElement("div");
    el.className = "line reveal" + (cls ? " " + cls : "");
    el.innerHTML = html;
    return el;
  }
  function spacer() {
    const el = document.createElement("div");
    el.className = "block reveal";
    el.style.height = "2px";
    return el;
  }

  steps.push(() => cmd("whoami"));
  steps.push(() => {
    const wrap = document.createElement("div");
    wrap.className = "reveal";
    wrap.innerHTML =
      '<h1 class="banner">Alan Clesio</h1>' +
      '<div class="role">// Software Developer · Full-Stack &amp; Cloud</div>';
    return wrap;
  });
  steps.push(() => spacer());

  steps.push(() => cmd("cat about.txt"));
  steps.push(() =>
    out(
      '<span class="muted">I build reliable, well-crafted software — from APIs and data\n' +
      'pipelines to polished interfaces. I care about clean code,\n' +
      'good architecture, and shipping things that actually work.</span>'
    )
  );
  steps.push(() => spacer());

  steps.push(() => cmd("./skills.sh --list"));
  steps.push(() => {
    const grid = document.createElement("div");
    grid.className = "skill-grid reveal";
    skills.forEach(([name, pct]) => {
      const row = document.createElement("div");
      row.className = "skill-row";
      row.innerHTML =
        '<span class="skill-name">' + name + "</span>" +
        '<span class="bar"><span style="--w:' + pct + '%"></span></span>';
      grid.appendChild(row);
    });
    return grid;
  });
  steps.push(() => spacer());

  steps.push(() => cmd("ls ./contact"));
  steps.push(() =>
    out(
        '<span class="key">email</span>    <span class="val">contact@alanclesio.com</span>\n' +
      '<span class="key">site</span>     <a href="https://alanclesio.com">alanclesio.com</a>\n' +
      '<span class="key">status</span>   <span class="ok">● available for work</span>'
    )
  );
  steps.push(() => spacer());

  // interactive prompt
  steps.push(() => {
    const wrap = document.createElement("div");
    wrap.className = "input-line reveal";
    wrap.innerHTML =
      PROMPT +
      '<input id="userInput" autocomplete="off" spellcheck="false" aria-label="terminal input" />';
    return wrap;
  });
  steps.push(() => out('<span class="hint">Type <b>help</b> and press <b>Enter</b> ↵</span>'));

  // Render steps with a staggered delay for a "loading" feel.
  let i = 0;
  function next() {
    if (i >= steps.length) {
      initInteractive();
      return;
    }
    const node = steps[i]();
    node.style.animationDelay = "0s";
    screen.appendChild(node);
    const isCmd = node.classList.contains("line") &&
      node.innerHTML.includes('class="cmd"');
    i++;
    setTimeout(next, isCmd ? 260 : 150);
  }

  // ---- Interactive shell ----
  function println(html, cls) {
    const el = out(html, cls);
    el.style.animationDelay = "0s";
    // insert before the input line group
    const inputLine = document.querySelector(".input-line");
    screen.insertBefore(el, inputLine);
  }

  const COMMANDS = {
    help() {
      println(
        '<span class="muted">available commands:</span>\n' +
        '  <span class="key">whoami</span>     who is this\n' +
        '  <span class="key">skills</span>     list technical skills\n' +
        '  <span class="key">about</span>      short bio\n' +
        '  <span class="key">contact</span>    how to reach me\n' +
        '  <span class="key">social</span>     find me online\n' +
        '  <span class="key">clear</span>      clear the screen\n' +
        '  <span class="key">help</span>       show this message'
      );
    },
    whoami() { println('<span class="banner" style="font-size:18px">Alan Clesio</span> <span class="muted">— Software Developer</span>'); },
    about() {
      println('<span class="muted">Full-stack developer focused on clean, maintainable\nsoftware and great developer experience.</span>');
    },
    skills() {
      println('<span class="muted">' + skills.map(s => "• " + s[0] + " (" + s[1] + "%)").join("\n") + "</span>");
    },
    contact() {
      println(
        '<span class="key">email</span>  <span class="val">contact@alanclesio.com</span>\n' +
        '<span class="key">site</span>   <a href="https://alanclesio.com">alanclesio.com</a>'
      );
    },
    social() {
      println(
        '<span class="key">github</span>   <a href="https://github.com/alanclesio" target="_blank" rel="noopener noreferrer">github.com/alanclesio</a>\n' +
        '<span class="key">linkedin</span> <a href="https://www.linkedin.com/in/alanclesio" target="_blank" rel="noopener noreferrer">linkedin.com/in/alanclesio</a>'
      );
    },
    clear() {
      // remove everything except input group
      const nodes = [...screen.children];
      const inputLine = document.querySelector(".input-line");
      const hint = inputLine && inputLine.nextElementSibling;
      nodes.forEach(n => {
        if (n !== inputLine && n !== hint) screen.removeChild(n);
      });
    },
  };

  function initInteractive() {
    const input = document.getElementById("userInput");
    if (!input) return;
    input.focus();
    document.addEventListener("click", () => input.focus());

    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const raw = input.value.trim();
      const value = raw.toLowerCase();
      // echo the typed command
      println(PROMPT + '<span class="cmd">' + (raw || "") + "</span>");
      input.value = "";
      if (!value) return;
      const fn = COMMANDS[value];
      if (fn) fn();
      else println('<span class="muted">zsh: command not found: ' + raw +
        ' — try <span class="key">help</span></span>');
      input.scrollIntoView({ block: "nearest" });
    });
  }

  next();

  // ---- Interactive backdrop effects (mouse + scroll) ----
  (function backdropFX() {
    const root = document.documentElement;
    let tx = 50, ty = 40, cx = 50, cy = 40, raf = null;

    function render() {
      // ease the glow toward the pointer for a smooth trail
      cx += (tx - cx) * 0.12;
      cy += (ty - cy) * 0.12;
      root.style.setProperty("--mx", cx.toFixed(2) + "%");
      root.style.setProperty("--my", cy.toFixed(2) + "%");
      if (Math.abs(tx - cx) > 0.1 || Math.abs(ty - cy) > 0.1) {
        raf = requestAnimationFrame(render);
      } else {
        raf = null;
      }
    }
    function kick() { if (raf === null) raf = requestAnimationFrame(render); }

    window.addEventListener("pointermove", (e) => {
      tx = (e.clientX / window.innerWidth) * 100;
      ty = (e.clientY / window.innerHeight) * 100;
      kick();
    }, { passive: true });

    function onScroll() {
      const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const p = Math.min(1, Math.max(0, window.scrollY / max));
      root.style.setProperty("--shift", p.toFixed(3));
      root.style.setProperty("--scrollGlow", p.toFixed(3));
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  })();
})();
</script>
</body>
</html>
